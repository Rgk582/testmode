name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set +e
          xcodebuild \
            -project TestModeDemo.xcodeproj \
            -scheme TestModeDemo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.0.${{ github.run_number }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build > build.log 2>&1
          STATUS=$?
          grep -E "error:|fatal error" build.log | sort -u | head -80
          if [ $STATUS -ne 0 ]; then
            echo "BUILD FAILED"
            tail -60 build.log
            exit $STATUS
          fi

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/TestModeDemo.app
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry TestModeDemo.ipa Payload
          ls -lh TestModeDemo.ipa

      - name: Save IPA to ci-ipa branch
        run: |
          mkdir -p /tmp/ipa && cp TestModeDemo.ipa /tmp/ipa/ && echo "${GITHUB_SHA::7}" > /tmp/ipa/commit.txt
          cd /tmp/ipa && git init -q -b ci-ipa && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "IPA for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" TestModeDemo.ipa \
            --title "Test Mode demo shell 1.0.${{ github.run_number }}" \
            --notes "Shell app only, with no Test Mode web files. Merge it with your own Test Mode IPA using tools/make_demo_ipa.py before signing." \
            --latest
